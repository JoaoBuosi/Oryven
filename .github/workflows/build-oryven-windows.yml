name: Build Oryven Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Install frontend dependencies
        working-directory: web
        run: npm install

      - name: Install backend dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build backend sidecar
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\scripts\build-backend.ps1
          if (-not (Test-Path ".\backend-dist\oryven-backend.exe")) {
            throw "Backend sidecar was not generated."
          }

      - name: Show environment
        shell: powershell
        run: |
          node --version
          npm --version
          python --version
          rustc --version
          cargo --version

      - name: Build Oryven
        working-directory: web
        run: npm run tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Oryven-Windows-NSIS
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Oryven-Windows-MSI
          path: |
            web/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
